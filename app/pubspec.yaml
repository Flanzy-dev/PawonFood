name: pawonfood
description: "PawonFood: dari dapur ke dapur. Aplikasi berbagi makanan sisa hiperlokal."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  camera: ^0.12.0+2
  flutter_svg: ^2.3.0
  lucide_icons_flutter: ^3.1.21

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/brand/
    - assets/images/food/
    - assets/mock/

  fonts:
    # Variable fonts (OFL): weight and optical size are set through FontVariation in AppTypography.
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#2F5D39"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  remove_alpha_ios: true
